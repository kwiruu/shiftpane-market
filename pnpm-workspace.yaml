packages:
  - apps/*
  - packages/*

# One version of each shared dependency across the repo. Reference with "catalog:".
catalog:
  # tooling
  '@biomejs/biome': 2.5.15
  turbo: ^2.11.9
  typescript: ^7.0.2
  vitest: ^5.0.5
  '@types/node': ^24.19.2
  # runtime
  react: ^19.3.1
  react-dom: ^19.3.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  zod: ^4.6.7

# Packages allowed to run install scripts. pnpm 11+ reads allowBuilds; pnpm 10 reads the list below it.
allowBuilds:
  sharp: true
  '@tailwindcss/oxide': true

onlyBuiltDependencies:
  - sharp
  - '@tailwindcss/oxide'
